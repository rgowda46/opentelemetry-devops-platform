 # CI for product catalog service
name: product-catalog-ci

on: 
    pull_request:
      branches: [ main ]

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-version: 1.22

        - name: Build
          run: |
                cd src/product-catalog
                go mod download
                go build -o product-catalog-service main.go

        - name: Run unit tests
          run: |
                cd src/product-catalog
                go test ./...


    code-quality:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.22'

        - name: Install golangci-lint
          run: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v1.56.2

        - name: Verify golangci-lint installation
          run: golangci-lint version

        - name: Run golangci-lint
          working-directory: src/product-catalog
          run: |
                golangci-lint run 

    docker:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Docker
          uses: docker/setup-buildx-action@v1

        - name: Login to Docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
          
        - name: Docker Push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}

    updatek8s:
      runs-on: ubuntu-latest
      needs: docker
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with: 
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Setup kubectl
          uses: azure/setup-kubectl@v1

        - name: Update tag in kubernetes deployment manifest
          run: |
                sed -i 's/image: .*/image: '"${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}"'/' kubernetes/productcatalog/deploy.yaml
                
        - name: Commit and push changes
          run: |
                git config --global user.name "Rohith Gowda"
                git config --global user.email "rmrohithgowda@gmail.com"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]:Update product catalog image tag to ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}"
                git push



